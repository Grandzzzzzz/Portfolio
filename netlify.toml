[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PORTFOLIO_DEPLOY_TARGET = "netlify"
  NITRO_PRESET = "netlify"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "private, no-store"

[dev]
  command = "npm run dev:netlify"
  targetPort = 3001
  port = 8888
  framework = "#custom"
